<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘系统（精简开源版）</title>
<meta name="description" content="免费开源的招聘系统精简版：职位浏览、在线投递简历、查看投递人数，后台职位与应聘管理，真实增删改查功能，纯前端+localStorage实现，可作为学习或二次开发起点。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">招聘<span class="accent">直通车</span></div>
    <a href="admin.html" class="nav-link">进入 HR 后台 →</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>找一份合适的工作</h1>
      <p>浏览当前在招职位，点击职位查看详情并在线投递简历。这是一个真实可用的精简开源系统，数据保存在你浏览器本地。</p>
    </div>
    <div id="jobGrid" class="job-grid"></div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseModal">&times;</button>
      <h2 id="modalJobTitle"></h2>
      <p class="sub" id="modalJobMeta"></p>
      <div class="booked-ranges" id="jobRequirements"></div>
      <div class="booked-ranges" id="applyCount"></div>
      <div id="modalMsg"></div>
      <form id="applyForm" novalidate>
        <div class="field">
          <label>姓名</label>
          <input id="candidateNameInput" type="text" required placeholder="用于联系你的姓名">
        </div>
        <div class="field">
          <label>手机号</label>
          <input id="phoneInput" type="text" required placeholder="用于 HR 联系你的手机号">
        </div>
        <div class="field">
          <label>简历摘要 / 自我介绍</label>
          <textarea id="resumeInput" rows="4" required placeholder="简单介绍一下你的工作经历、技能或优势"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">提交应聘申请</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
